<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Tamu · Cwk & Hasna</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..500;1,6..96,400&family=Jost:wght@400;500&display=swap">
<style>
:root{--paper:#FFF7EA;--cream:#FFEDD2;--olive:#8F8E52;--olive-d:#66653A;--olive-dd:#4B4A2A;--ink:#33321F;--muted:#6E6C51;--line:rgba(75,74,42,.18);--blush:#E9CFC8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 Jost,"Helvetica Neue",system-ui,sans-serif;padding:clamp(40px,7vw,88px) max(16px,env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased}
main{max-width:940px;margin:0 auto;display:grid;gap:22px}
.kicker{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font:400 clamp(38px,5vw,58px)/1.05 "Bodoni Moda",Didot,Georgia,serif;letter-spacing:-.01em;margin:0}
h1 em{color:var(--olive)}
.card{background:#fff;border:1px solid var(--line);padding:clamp(20px,3vw,32px);display:grid;gap:14px}
label,strong{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:500}
input,textarea{width:100%;font:inherit;border:1px solid var(--line);padding:12px 14px;background:var(--paper);color:var(--ink)}
input:focus,textarea:focus{outline:0;border-color:var(--olive-d)}
textarea{min-height:140px;resize:vertical}
.muted{color:var(--muted);font-size:13px}
button{font:500 10.5px Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--olive-d);border-radius:999px;padding:11px 18px;background:var(--olive-d);color:var(--cream);cursor:pointer}
button:hover{background:var(--olive-dd)}
button.ghost{background:transparent;color:var(--olive-dd);border-color:rgba(75,74,42,.32)}
button.ghost:hover{background:var(--olive-d);color:var(--cream)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.26em;font-weight:500}
td:first-child{font:400 18px "Bodoni Moda",Didot,serif}
.wrap{overflow-x:auto}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
pre{background:var(--olive-dd);color:var(--cream);padding:16px;white-space:pre-wrap;margin:0}
.link{word-break:break-all;color:var(--olive-d)}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <div><p class="kicker">Untuk mempelai · jangan dibagikan</p><h1>Daftar tamu &amp; <em>link undangan</em></h1></div>
  <div class="card">
    <label for="base">Alamat website undangan</label>
    <input id="base" placeholder="https://cwk-hasna.vercel.app">
    <label for="names">Nama tamu (satu per baris)</label>
    <textarea id="names">Nova
B&amp;B
OISHI</textarea>
    <label for="tpl">Pesan WhatsApp</label>
    <textarea id="tpl" style="min-height:110px">Assalamualaikum {nama},
Dengan penuh sukacita kami mengundang Anda ke pernikahan kami, Cwk & Hasna, Sabtu 26 Desember 2026 di Taman Kenanga, Cianjur.
Undangan lengkap: {link}</textarea>
  </div>
  <div class="card">
    <div class="wrap"><table><thead><tr><th>Nama</th><th>Link</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <div class="card">
    <strong>SQL untuk menambah tamu ke Supabase</strong>
    <p class="muted">Salin lalu jalankan di Supabase → SQL Editor, supaya nama tamu tampil persis seperti yang kamu tulis.</p>
    <pre id="sql"></pre>
    <div><button id="copySql" type="button">Salin SQL</button></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
try{ $('#base').value = localStorage.getItem('base') || location.origin.replace(/\/$/,'') || ''; }catch(_){ $('#base').value = location.origin; }
const slugify=n=>n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,'n').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'tamu';
function copy(t){ navigator.clipboard.writeText(t).catch(()=>prompt('Salin:',t)); }
function render(){
  const base=$('#base').value.trim().replace(/\/$/,''); try{localStorage.setItem('base',base)}catch(_){}
  const names=$('#names').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const seen={}; const list=names.map(n=>{ let s=slugify(n); if(seen[s]) s+='-'+(++seen[s]); else seen[s]=1; return {n,s,link:`${base}/?to=${s}`}; });
  const tb=$('#rows'); tb.textContent='';
  list.forEach(g=>{ const tr=document.createElement('tr');
    const a=document.createElement('td'); a.textContent=g.n;
    const b=document.createElement('td'); b.className='link'; b.textContent=g.link;
    const c=document.createElement('td'); c.className='row';
    const b1=document.createElement('button'); b1.className='ghost'; b1.textContent='Salin link'; b1.onclick=()=>copy(g.link);
    const msg=$('#tpl').value.replaceAll('{nama}',g.n).replaceAll('{link}',g.link);
    const b2=document.createElement('button'); b2.textContent='Kirim WA'; b2.onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
    c.append(b1,b2); tr.append(a,b,c); tb.appendChild(tr); });
  const esc=s=>s.replace(/'/g,"''");
  $('#sql').textContent = list.length ? 'insert into public.guests (slug, name) values\n' + list.map(g=>`  ('${g.s}', '${esc(g.n)}')`).join(',\n') + '\non conflict (slug) do update set name = excluded.name;' : '-- tulis nama tamu dulu';
}
['base','names','tpl'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#copySql').onclick=()=>copy($('#sql').textContent);
render();
</script>
</body>
</html>
